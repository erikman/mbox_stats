[project]
name = "mbox-stats"
version = "0.1.0"
description = "This is a tool for pulling statistics out of a MBox file."
authors = [{ name = "Erik Man", email = "erikman@users.noreply.github.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["beautifulsoup4>=4.13,<5", "flask>=3.1,<4"]

[project.scripts]
mbox-serve = "mbox_stats.server:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
